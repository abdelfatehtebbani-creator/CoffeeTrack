<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap');

  :root{
    --brand-orange:#E8712F;
    --brand-orange-dark:#C85A1F;
    --brand-gold:#C9A227;
    --brand-gold-dark:#A9860F;
    --brand-beige:#C7A97A;
    --brand-beige-dark:#A9885C;
    --brand-brown:#4A2C1D;
    --brand-brown-dark:#2E1B12;
    --brand-cream:#FBF3EA;
    --brand-cream-2:#F3E5D4;
    --text-dark:#2E1B12;
    --text-muted:#8A7161;
    --success:#3C8C5E;
    --danger:#C8402A;
    --warning:#D99A2B;
    --radius:16px;
    --shadow:0 8px 24px rgba(74,44,29,0.12);
    --shadow-sm:0 2px 8px rgba(74,44,29,0.08);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:linear-gradient(160deg,var(--brand-cream) 0%, var(--brand-cream-2) 100%);
    color:var(--text-dark);
    font-family:'Poppins','Cairo',sans-serif;
    min-height:100vh;
  }
  body[dir="rtl"]{ font-family:'Cairo','Poppins',sans-serif; }

  .app-shell{ max-width:1180px; margin:0 auto; padding:20px 24px 60px; }

  /* ===== Header ===== */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 22px; margin-bottom:24px;
    background:var(--brand-brown); border-radius:var(--radius);
    box-shadow:var(--shadow); color:#fff;
  }
  .app-header .brand{ display:flex; align-items:center; gap:14px; }
  .app-header .brand img{ height:48px; width:48px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px var(--brand-orange); }
  .app-header .brand-text .title{ font-weight:800; font-size:18px; letter-spacing:.3px; }
  .app-header .brand-text .subtitle{ font-size:12px; opacity:.8; }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.12); padding:6px 14px; border-radius:999px;
    font-size:12px; font-weight:600;
  }

  .btn{
    border:none; cursor:pointer; border-radius:12px; padding:10px 18px;
    font-weight:600; font-size:14px; transition:.15s ease; font-family:inherit;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brand-orange); color:#fff; }
  .btn-primary:hover{ background:var(--brand-orange-dark); }
  .btn-ghost{ background:rgba(255,255,255,.12); color:#fff; }
  .btn-ghost:hover{ background:rgba(255,255,255,.22); }
  .btn-outline{ background:transparent; border:1.5px solid var(--brand-orange); color:var(--brand-orange-dark); }
  .btn-outline:hover{ background:var(--brand-orange); color:#fff; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }

  /* ===== Cards ===== */
  .card{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm);
    padding:22px; margin-bottom:20px; border:1px solid rgba(74,44,29,.06);
  }
  .card-title{
    font-weight:700; font-size:16px; margin:0 0 16px; display:flex; align-items:center; gap:8px;
    color:var(--brand-brown);
  }
  .card-title .dot{ width:8px; height:8px; border-radius:50%; background:var(--brand-orange); }

  /* ===== Grid / KPI ===== */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi{
    background:#fff; border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm);
    border-inline-start:5px solid var(--brand-orange);
  }
  .kpi .kpi-label{ font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
  .kpi .kpi-value{ font-size:22px; font-weight:800; color:var(--brand-brown-dark); }
  .kpi .kpi-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }

  /* ===== Framing cards (تجميع بطاقات/أزرار داخل إطار بلون مميز) ===== */
  .card-accent-orange{ border-inline-start:6px solid var(--brand-orange); }
  .card-accent-gold{ border-inline-start:6px solid var(--brand-gold); }
  .card-accent-beige{ border-inline-start:6px solid var(--brand-beige); }
  .card-accent-orange .card-title .dot{ background:var(--brand-orange); }
  .card-accent-gold .card-title .dot{ background:var(--brand-gold); }
  .card-accent-beige .card-title .dot{ background:var(--brand-beige); }

  /* بطاقات الرصيد الصغيرة داخل إطارها الذهبي تتحوّل هي أيضاً من برتقالي إلى ذهبي */
  #balanceCard .kpi{ border-inline-start-color:var(--brand-gold); }

  /* ===== Tabs (Entry page) ===== */
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .tab-btn{
    background:#fff; border:1.5px solid rgba(74,44,29,.12); color:var(--text-muted);
    padding:10px 16px; border-radius:12px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--brand-brown); color:#fff; border-color:var(--brand-brown); }

  /* ===== Forms ===== */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--brand-brown); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid rgba(74,44,29,.15);
    font-size:14px; font-family:inherit; background:var(--brand-cream); color:var(--text-dark);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brand-orange); background:#fff; }
  .field.full{ grid-column:1 / -1; }

  .alert{ padding:12px 16px; border-radius:10px; font-size:13px; font-weight:600; margin-top:14px; display:none; }
  .alert.show{ display:block; }
  .alert-success{ background:#E7F5EC; color:var(--success); }
  .alert-error{ background:#FBEAE7; color:var(--danger); }
  .alert-info{ background:#FFF6E5; color:var(--warning); }

  /* ===== Table ===== */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:start; padding:10px 12px; background:var(--brand-cream-2); color:var(--brand-brown);
    font-weight:700; position:sticky; top:0;
  }
  tbody td{ padding:9px 12px; border-bottom:1px solid rgba(74,44,29,.06); }
  tbody tr:hover{ background:var(--brand-cream); }
  .table-wrap{ max-height:320px; overflow:auto; border-radius:12px; border:1px solid rgba(74,44,29,.08); }
  .totals-row td{ font-weight:800; background:var(--brand-cream-2); }

  .badge{ padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  .badge-ok{ background:#E7F5EC; color:var(--success); }
  .badge-warn{ background:#FFF6E5; color:var(--warning); }
  .badge-danger{ background:#FBEAE7; color:var(--danger); }

  /* ===== Login page ===== */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{
    background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:40px 34px;
    width:100%; max-width:380px; text-align:center;
  }
  .login-card img.logo{ width:88px; height:88px; border-radius:50%; margin-bottom:14px; box-shadow:0 0 0 4px var(--brand-cream-2); }
  .login-card h1{ font-size:19px; margin:0 0 4px; color:var(--brand-brown-dark); }
  .login-card p.tagline{ font-size:12.5px; color:var(--text-muted); margin:0 0 22px; }
  .login-card .field{ text-align:start; margin-bottom:14px; }

  .lang-switch{
    position:fixed; top:16px; inset-inline-end:16px; z-index:50;
    background:#fff; border-radius:999px; box-shadow:var(--shadow-sm);
    display:flex; padding:4px; gap:2px;
  }
  .lang-switch button{
    border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700;
    cursor:pointer; color:var(--text-muted);
  }
  .lang-switch button.active{ background:var(--brand-orange); color:#fff; }

  .empty-state{ text-align:center; padding:30px; color:var(--text-muted); font-size:13px; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:640px){
    .app-header{ flex-direction:column; align-items:flex-start; gap:10px; }
    .header-actions{ width:100%; justify-content:space-between; }
  }
</style>
